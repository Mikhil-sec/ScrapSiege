<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrap Siege</title>
<meta name="description" content="Scrap Siege — an augmented-reality tabletop strategy game for Android.">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #14110d;
    color: #ece4d6;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 2rem;
  }
  .card { max-width: 32rem; }
  .eyebrow {
    color: #e8a33d; font-size: 0.75rem; letter-spacing: 0.18em;
    text-transform: uppercase; font-weight: 700; margin: 0 0 0.6rem;
  }
  h1 { font-size: clamp(1.8rem, 6vw, 2.5rem); margin: 0 0 1rem; line-height: 1.15; }
  p { color: #a89b86; margin: 0 0 1.5rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin-bottom: 0.6rem; }
  a { color: #e8a33d; text-underline-offset: 2px; }
  a:hover { color: #f5bd66; }
</style>
</head>
<body>
<div class="card">
  <p class="eyebrow">Android · Augmented Reality</p>
  <h1>Scrap Siege</h1>
  <p>An augmented-reality tabletop strategy game. Point your phone at a table, drop a battlefield onto
  it at real scale, and fight for it — where you physically stand is part of how you play.</p>
  <ul>
    <li><a href="privacy/">Privacy policy</a></li>
    <li><a href="https://github.com/Mikhil-sec/ScrapSiege">Source code on GitHub</a></li>
  </ul>
</div>
</body>
</html>
